<!doctype html>
<html>
<head>
<meta charset="utf-8"><title>Scrappee SERP Import</title>
<style>
body{font:14px Arial,sans-serif;width:400px;padding:12px;margin:0;color:#202124;background:#fff} .app-header{padding:2px 2px 10px}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:19px;font-weight:700;letter-spacing:-.2px}.version{font-size:11px;color:#777;font-weight:600}.connection{font-size:11px;color:#167a45;background:#eaf7ef;border:1px solid #ccebd8;border-radius:999px;padding:4px 8px;white-space:nowrap}.connection.offline{color:#a33;background:#fff2f2;border-color:#f0cccc}.scrap-line{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:#555}.scrap-name{font-weight:700;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scrap-status{font-size:10px;background:#eaf7ef;color:#167a45;border-radius:999px;padding:3px 7px;font-weight:700}.footer{border-top:1px solid #e5e5e5;margin-top:12px;padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#777;font-size:10px}.footer-actions{display:flex;gap:5px}.footer-actions button{width:auto;margin:0;padding:5px 8px;font-size:10px}.top-stats{margin:8px 0 10px}.tabs{margin:0 0 10px}h3{margin:0 0 12px}.field{width:100%;box-sizing:border-box;padding:9px;margin:5px 0;border:1px solid #ccc;border-radius:5px}button{width:100%;padding:9px;border:0;border-radius:5px;cursor:pointer;margin-top:6px;background:#eee}.primary{font-weight:700}.count{font-size:18px;font-weight:700;margin:8px 0}.top-stats{margin:12px 0 14px}.tabs{display:flex;border-bottom:1px solid #ddd;margin:0 0 12px}.tab{flex:1;border:0;border-radius:7px 7px 0 0;background:#f1f1f1;font-weight:700;margin:0;padding:10px 6px}.tab.active{background:#222;color:#fff}.tab-panel.hidden{display:none}.tab-panel[hidden]{display:none}.index-card{border:1px solid #d8e4ee;border-radius:9px;padding:10px;margin:10px 0;background:#f7fbff}.index-ok{display:flex;align-items:center;gap:8px;font-weight:700;color:#167a45}.index-ok .dot{width:22px;height:22px;border-radius:50%;background:#d9f2e4;display:inline-flex;align-items:center;justify-content:center}.index-meta{font-size:12px;color:#555;line-height:1.4;margin-top:5px;overflow-wrap:anywhere}.index-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin:8px 0}.index-stat{padding:9px;background:#fafafa;text-align:center}.index-stat b{display:block;font-size:18px;margin-top:3px}.index-stat small{font-size:10px;color:#777}.lead-card{padding:9px;border:1px solid #ddd;border-radius:8px;margin:6px 0;background:#fff}.lead-card b{font-size:14px}.lead-card span{display:block;font-size:11px;color:#555;margin-top:2px;overflow-wrap:anywhere}.lead-head{display:flex;justify-content:space-between;gap:6px}.lead-pill{font-size:10px!important;color:#167a45!important;background:#d9f2e4;padding:3px 7px;border-radius:10px;white-space:nowrap}.linkish{text-align:right;font-size:12px;color:#1769d1;cursor:pointer;margin:6px 0}.page-leads{max-height:260px;overflow:auto}.hint{font-size:12px;color:#666;margin-top:8px}.status{margin-top:10px;line-height:1.35;white-space:pre-wrap}.results{max-height:180px;overflow:auto;margin-top:8px;border-top:1px solid #ddd}.result{padding:7px 0;border-bottom:1px solid #eee}.result b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result span{display:block;font-size:11px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hidden{display:none}.row{display:flex;gap:6px}.row button{width:auto;flex:1}.filter{display:flex;align-items:center;justify-content:space-between;margin:8px 0;padding:7px 0}.filter-label{font-weight:700}.switch{position:relative;display:inline-block;width:42px;height:22px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#bbb;border-radius:22px;cursor:pointer}.slider:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}.switch input:checked+.slider{background:#222}.switch input:checked+.slider:before{transform:translateX(20px)}
</style>
</head>
<body>
<div id="loginView"><h3>Scrappee Login</h3>
<input id="email" class="field" type="email" autocomplete="username" placeholder="Email">
<input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password">
<button id="login" class="primary">LOGIN</button><div id="loginStatus" class="status"></div>
</div>
<div id="appView" class="hidden">
<div class="app-header"><div class="brand-row"><div><span class="brand">Scrappee</span> <span id="version" class="version"></span></div><span id="connectionStatus" class="connection">● Connected</span></div><div class="scrap-line"><span>Current Scrap:</span><span id="target" class="scrap-name">loading…</span><span id="scrapStatus" class="scrap-status">—</span></div><div id="account" class="hint"></div></div>
<div class="index-stats top-stats"><div class="index-stat"><small>SERP CAPTURED</small><b id="countTop">0</b><small>Search results</small></div><div class="index-stat"><small>PAGE LEADS</small><b id="pageLeadCountValue">0</b><small>Indexed page</small></div><div class="index-stat"><small>PAGE INDEXER</small><b id="pageCost">$0.00</b><small>Per page</small></div></div>
<div class="tabs" role="tablist"><button id="tabSearches" class="tab active" role="tab" aria-selected="true">Google / Bing Searches</button><button id="tabPages" class="tab" role="tab" aria-selected="false">Page Leads Capture</button></div>

<div id="searchPanel" class="tab-panel">
<div class="filter"><span class="filter-label">Email only</span><label class="switch"><input id="emailOnlySearch" type="checkbox"><span class="slider"></span></label></div>
<button id="autoStart" class="primary">START AUTOMATIC SERP COLLECTION</button>
<button id="autoStop" class="primary hidden">STOP SERP COLLECTION</button>
<button id="autoResume" class="primary hidden">RESUME AFTER CAPTCHA</button>
<button id="startCrawl" class="primary hidden">START SCRAPY CRAWL</button>
<button id="clear">CLEAR LOCAL PREVIEW</button>
<div id="status" class="status"></div><div id="results" class="results"></div>
</div>

<div id="pagePanel" class="tab-panel">
<div class="filter"><span class="filter-label">Email only</span><label class="switch"><input id="emailOnlyPage" type="checkbox"><span class="slider"></span></label></div>
<div class="filter"><span class="filter-label">Auto Indexing</span><label class="switch"><input id="pageIndexAuto" type="checkbox"><span class="slider"></span></label></div>
<button id="indexPage" class="primary">INDEX THIS PAGE</button>
<div id="pageIndexStatus" class="status"></div><div id="pageIndexCard" class="index-card hidden"></div><button id="viewPageLeads" class="primary hidden">VIEW LAST INDEXED LEADS</button><div id="pageLeadResults" class="page-leads hidden"></div>
</div>

<div class="footer"><span>© 2026 Scrappee · Secure connection</span><div class="footer-actions"><button id="reloadScraps">REFRESH</button><button id="logout">LOG OUT</button></div></div>
</div>
<script src="popup.js"></script>
</body>
</html>
